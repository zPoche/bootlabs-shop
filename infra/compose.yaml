name: bootlabs-shop

services:
  postgres:
    image: postgres:16-alpine
    container_name: bootlabs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bootlabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bootlabs}
      POSTGRES_DB: ${POSTGRES_DB:-bootlabs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bootlabs} -d ${POSTGRES_DB:-bootlabs}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bootlabs

  redis:
    image: redis:7-alpine
    container_name: bootlabs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - bootlabs

  medusa:
    build:
      context: ..
      dockerfile: infra/Dockerfile.medusa
    container_name: bootlabs_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "postgres:host-gateway"
      - "redis:host-gateway"
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bootlabs}:${POSTGRES_PASSWORD:-bootlabs}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bootlabs}
      POSTGRES_HOST: postgres
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000,http://localhost:5173}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:9000,http://localhost:5173,http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-dev-only}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-cookie-secret-dev-only}
      # Optional one-time admin bootstrap. Set BOTH, then remove the password from .env.
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-}
      # false for local HTTP Compose; set true behind HTTPS.
      MEDUSA_COOKIE_SECURE: ${MEDUSA_COOKIE_SECURE:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - bootlabs

  storefront:
    build:
      context: ..
      dockerfile: infra/Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_placeholder_phase0}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-de}
        NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-${STRIPE_PUBLISHABLE_KEY:-}}
    container_name: bootlabs_storefront
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8000}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_placeholder_phase0}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-de}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-${STRIPE_PUBLISHABLE_KEY:-}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks:
      - bootlabs

volumes:
  postgres_data:

networks:
  bootlabs:
    driver: bridge
